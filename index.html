<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Personaliza tu experiencia</title>
</head>

<body class="tema-claro">
    <header> 
        <h1>Personaliza tu experiencia</h1>
        <p>Configura la apariencia de tu pagina web</p>
    </header>

    <main>
        <section id="contenedor-bienvenida"></section>
        <form id="formulario-preferencias">

            <div>
                <label for="nombre-usuario">Nombre de usuario</label>
                <input type="text" id="nombre-usuario" name="nombre" placeholder="introduce tu nombre" required>
            </div>

            <div>
                <label for="color-fondo">color de fondo</label>
                <input type="color" id="color-fondo" name="color" value="#f2f4f8">  <!--valor inicial del selector-->
            </div>

            <div>
                <label for="tema-visual">Tema visual:</label>
                <select id="tema-visual" name="tema">
                    <option value="claro">Claro</option>
                    <option value="oscuro">Oscuro</option>
                </select>
            </div>

            <div class="contenedor-botones"> 
                <button type="button" id="guardar-preferencias">Guardar preferencias</button>
                <button type="button" id="restablecer-interfaz">Restablecer interfaz</button>
            </div>
        </form>
    </main>

    <footer>
        <p>Proyectode personalizacion web</p>
    </footer>
    
</body>
</html>
